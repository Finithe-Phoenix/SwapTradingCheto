[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swap-trading-cheto"
version = "0.2.0"
description = "Reproducible BTC/ETH spot swing-trading research and paper trading"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
trading-lab = "trading_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

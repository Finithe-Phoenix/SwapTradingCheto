services:
  freqtrade:
    build: .
    image: swaptradingcheto:0.2.0
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LAB_UI_PASSWORD: ${LAB_UI_PASSWORD:?Run trading-lab init first}
      LAB_UI_JWT_SECRET: ${LAB_UI_JWT_SECRET:?Run trading-lab init first}
    volumes:
      - ./user_data:/freqtrade/user_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/ping', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

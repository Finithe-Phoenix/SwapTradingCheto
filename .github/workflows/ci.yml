name: Trading Lab CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-lab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    name: Research engine / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install research package
        run: python -m pip install -e .
      - name: Unit and scenario tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic demonstration
        run: trading-lab demo --output runs/ci-demo
      - name: Retain research report
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-research-report
          path: |
            runs/ci-demo/results/summary.json
            runs/ci-demo/results/REPORT.md
            runs/ci-demo/results/*/trades.csv
            runs/ci-demo/results/*/equity.csv
            runs/ci-demo/results/*/monthly.csv
            runs/ci-demo/results/*/annual.csv
          retention-days: 14

  freqtrade:
    name: Native Freqtrade integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned integration
        run: python -m pip install -e . -r requirements-freqtrade.txt
      - name: Test with real Freqtrade classes and schema
        run: python -m unittest discover -s tests -v

  container:
    name: Build paper-trading container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned image
        run: docker build -t swaptradingcheto:ci .
      - name: Load strategy inside container without contacting an exchange
        run: |
          docker run --rm --entrypoint python \
            -v "$PWD/user_data/strategies:/freqtrade/user_data/strategies:ro" \
            swaptradingcheto:ci -c "import sys; sys.path.insert(0, '/freqtrade/user_data/strategies'); from SwingBreakoutS1 import SwingBreakoutS1; print(SwingBreakoutS1.timeframe)"
